<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MetalForge">
  <title>MetalForge</title>
  <defs>
    <linearGradient id="ingot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8FB4D9"/>
      <stop offset="100%" stop-color="#5C7FA6"/>
    </linearGradient>
    <linearGradient id="anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4048"/>
      <stop offset="100%" stop-color="#24282E"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方（低饱和，靠明度分层） -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#16181C"/>
  <rect x="8" y="8" width="240" height="240" rx="50" fill="none" stroke="#2A2F36" stroke-width="2"/>

  <!-- 砧（bare metal 的隐喻） -->
  <path d="M56 150 h144 v16 c0 6 -4 10 -10 10 h-38 l-8 26 h20 v12 h-72 v-12 h20 l-8 -26 h-38 c-6 0 -10 -4 -10 -10 z"
        fill="url(#anvil)"/>
  <rect x="104" y="214" width="48" height="10" rx="4" fill="#3A4048"/>

  <!-- 金属锭（被锻造的对象） -->
  <g transform="rotate(-12 128 108)">
    <rect x="78" y="86" width="100" height="44" rx="10" fill="url(#ingot)"/>
    <rect x="78" y="86" width="100" height="14" rx="7" fill="#A8C4E0" opacity="0.35"/>
  </g>

  <!-- 火花：表示"编译/烧录"的动作 -->
  <g fill="#C8A87A">
    <circle cx="186" cy="70" r="4"/>
    <circle cx="204" cy="88" r="3"/>
    <circle cx="172" cy="52" r="2.5"/>
    <circle cx="214" cy="62" r="2"/>
  </g>

  <!-- 一条内存/指令网格，呼应多架构与底层 -->
  <g stroke="#5C7FA6" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M52 62 h16 M52 74 h28 M52 86 h12"/>
  </g>
</svg>
